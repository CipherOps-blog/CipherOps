<svg xmlns="http://www.w3.org/2000/svg" width="780" height="486" viewBox="0 0 780 486" role="img" aria-labelledby="t d">
<title id="t">Networks by geographic scope</title>
<desc id="d">Four nested scopes running from a personal area network at the centre outward through local and metropolitan networks to a wide area network.</desc>
<defs>
 <marker id="as" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#87A878"/></marker>
 <marker id="al" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#B8A9C9"/></marker>
</defs>
<style>
 text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
 .dev{fill:#87A878;fill-opacity:.18;stroke:#87A878;stroke-width:2}
 .host{fill:#B8A9C9;fill-opacity:.18;stroke:#B8A9C9;stroke-width:2}
 .dim{fill:#B8A9C9;fill-opacity:.07;stroke:#B8A9C9;stroke-width:2}
 .ext{fill:#B8A9C9;fill-opacity:.07;stroke:#B8A9C9;stroke-width:2;stroke-dasharray:7 5}
 .chip{fill:#87A878;fill-opacity:.12;stroke:none}
 .chipl{fill:#B8A9C9;fill-opacity:.12;stroke:none}
 .nd{font-size:16px;font-weight:600;fill:##000000}
 .nh{font-size:16px;font-weight:600;fill:##000000}
 .el{font-size:12px;fill:#87A878}
 .elh{font-size:12px;fill:#B8A9C9}
 .note{font-size:12.5px;fill:#B8A9C9}
 .nt{font-size:13px;font-weight:600;fill:#B8A9C9}
</style>
 
<circle cx="250" cy="230" r="200" fill="#87A878" />
<circle cx="250" cy="230" r="160" fill="#B8A9C9" />
<circle cx="250" cy="230" r="120" fill="#87A878" />
<circle cx="250" cy="230" r="70" fill="#B8A9C9" />
 
<g text-anchor="middle" font-size="13.5" font-weight="600">
  <text class="nd" x="250" y="60" font-size="13">Wide area network</text>
  <text class="nh" x="250" y="100" font-size="13">Metropolitan area network</text>
  <text class="nd" x="250" y="150" font-size="13">Local area network</text>
  <text class="nh" x="250" y="220" font-size="15">Personal area</text>
  <text class="nh" x="250" y="240" font-size="15">network</text>
</g>
 

<g>
  <rect class="dev" x="490" y="52" width="272" height="74" rx="9" fill-opacity=".10"/>
  <text class="el" x="508" y="78" font-size="14.5">Wide area network</text>
  <text class="el" x="508" y="100" fill-opacity=".9">Countries or continents, usually built</text>
  <text class="el" x="508" y="117" fill-opacity=".9">on capacity leased from carriers.</text>

  <rect class="dim" x="490" y="140" width="272" height="74" rx="9" fill-opacity=".10"/>
  <text class="note" x="508" y="166" font-size="14.5">Metropolitan area network</text>
  <text class="note" x="508" y="188" fill-opacity=".9">A city or urban region, run by councils,</text>
  <text class="note" x="508" y="205" fill-opacity=".9">universities or carriers.</text>

  <rect class="dev" x="490" y="228" width="272" height="74" rx="9" fill-opacity=".10"/>
  <text class="el" x="508" y="254" font-size="14.5">Local area network</text>
  <text class="el" x="508" y="276" fill-opacity=".9">A building or campus over Ethernet or</text>
  <text class="el" x="508" y="293" fill-opacity=".9">Wi-Fi, owned by one organisation.</text>

  <rect class="dim" x="490" y="316" width="272" height="74" rx="9" fill-opacity=".10"/>
  <text class="note" x="508" y="342" font-size="14.5">Personal area network</text>
  <text class="note" x="508" y="364" fill-opacity=".9">The range of one person, over short-hop</text>
  <text class="note" x="508" y="381" fill-opacity=".9">links such as Bluetooth or USB.</text>
</g>

<g class="conn">
  <line x1="391.4" y1="88.6" x2="490" y2="89" stroke="#87A878" marker-end="url(#as)"/>
  <line x1="397.8" y1="168.8" x2="490" y2="177" stroke="#B8A9C9" marker-end="url(#al)"/>
  <line x1="370" y1="230" x2="490" y2="265" stroke="#87A878" marker-end="url(#as)"/> 
  <line x1="299.5" y1="279.5" x2="490" y2="353" stroke="#B8A9C9" marker-end="url(#al)"/>
</g>
</svg>
