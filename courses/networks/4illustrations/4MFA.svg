<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-labelledby="t d">
<title id="t">The three authentication factor categories</title>
<desc id="d">Knowledge, possession and inherence factors converging on an authentication decision that requires at least two factors from different categories.</desc>
<defs>
 <marker id="as" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#87A878"/></marker>
 <marker id="al" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#B8A9C9"/></marker>
</defs>
<style>
 text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
 .card{fill-opacity:.10;stroke-width:2}
 .h{font-size:17px;font-weight:600}
 .sub{font-size:12.5px;font-style:italic;fill-opacity:.9}
 .it{font-size:12.5px}
 .gate{font-size:15px;font-weight:600}
 .note{font-size:12.5px;fill-opacity:.9}
 .sg{fill:#87A878}.lv{fill:#B8A9C9}
</style>

<g>
  <rect class="card" x="30" y="54" width="220" height="176" rx="12" fill="#87A878" stroke="#87A878"/>
  <g stroke="#87A878" stroke-width="2" fill="none">
    <rect x="106" y="76" width="68" height="30" rx="6"/>
    <circle cx="124" cy="91" r="4" fill="#87A878"/><circle cx="140" cy="91" r="4" fill="#87A878"/><circle cx="156" cy="91" r="4" fill="#87A878"/>
  </g>
  <text class="h sg" x="140" y="132" text-anchor="middle">Knowledge</text>
  <text class="sub sg" x="140" y="151" text-anchor="middle">something you know</text>
  <text class="it sg" x="140" y="180" text-anchor="middle">Password</text>
  <text class="it sg" x="140" y="200" text-anchor="middle">PIN, passphrase</text>

  <rect class="card" x="290" y="54" width="220" height="176" rx="12" fill="#B8A9C9" stroke="#B8A9C9"/>
  <g stroke="#B8A9C9" stroke-width="2" fill="none">
    <rect x="382" y="70" width="36" height="42" rx="5"/>
    <line x1="382" y1="80" x2="418" y2="80"/>
    <circle cx="400" cy="96" r="6"/>
  </g>
  <text class="h lv" x="400" y="132" text-anchor="middle">Possession</text>
  <text class="sub lv" x="400" y="151" text-anchor="middle">something you have</text>
  <text class="it lv" x="400" y="180" text-anchor="middle">Hardware token, smart card</text>
  <text class="it lv" x="400" y="200" text-anchor="middle">Authenticator application</text>

  <rect class="card" x="550" y="54" width="220" height="176" rx="12" fill="#87A878" stroke="#87A878"/>
  <g stroke="#87A878" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M642 108 a18,22 0 0 1 36,0"/>
    <path d="M648 108 a12,15 0 0 1 24,0"/>
    <path d="M654 108 a6,9 0 0 1 12,0"/>
    <path d="M636 108 a24,29 0 0 1 48,0"/>
  </g>
  <text class="h sg" x="660" y="132" text-anchor="middle">Inherence</text>
  <text class="sub sg" x="660" y="151" text-anchor="middle">something you are</text>
  <text class="it sg" x="660" y="180" text-anchor="middle">Fingerprint, face</text>
  <text class="it sg" x="660" y="200" text-anchor="middle">Other biometric traits</text>
</g>

<g fill="none" stroke-width="2">
  <path d="M140 234 C140 268 260 262 322 284" stroke="#87A878" marker-end="url(#as)"/>
  <path d="M400 234 L400 282" stroke="#B8A9C9" marker-end="url(#al)"/>
  <path d="M660 234 C660 268 540 262 478 284" stroke="#87A878" marker-end="url(#as)"/>
</g>

<rect x="230" y="290" width="340" height="56" rx="10" fill="#B8A9C9" fill-opacity=".14" stroke="#B8A9C9" stroke-width="2"/>
<text class="gate lv" x="400" y="316" text-anchor="middle">At least two factors,</text>
<text class="gate lv" x="400" y="336" text-anchor="middle">from different categories</text>

<line x1="400" y1="346" x2="400" y2="378" stroke="#87A878" stroke-width="2" marker-end="url(#as)"/>
<rect x="305" y="384" width="190" height="44" rx="22" fill="#87A878" fill-opacity=".18" stroke="#87A878" stroke-width="2"/>
<text class="gate sg" x="400" y="412" text-anchor="middle">Access granted</text>

<text class="note lv" x="400" y="456" text-anchor="middle">A password plus a security question is not multi-factor: both are knowledge.</text>
</svg>
