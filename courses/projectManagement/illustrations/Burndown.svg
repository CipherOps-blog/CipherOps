<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Sprint burndown chart</title>
  <desc id="desc">A burndown chart comparing actual sprint progress against the ideal line over ten working days.</desc>

  <defs>
    <style>
      .bg { fill: #f8f9fb; }
      .axis { stroke: #3d4d5a; stroke-width: 2; }
      .grid { stroke: #d6dde8; stroke-width: 1; }
      .label { fill: #243446; font: 600 18px 'Segoe UI', Arial, sans-serif; }
      .tick { fill: #4d5f72; font: 14px 'Segoe UI', Arial, sans-serif; }
      .ideal { fill: none; stroke: #7aa9d8; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .actual { fill: none; stroke: #6ea56b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .point { fill: #6ea56b; }
      .legend { fill: #243446; font: 600 16px 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="520" rx="18"/>

  <g transform="translate(90,70)">
    <g>
      <line class="grid" x1="0" y1="350" x2="620" y2="350"/>
      <line class="grid" x1="0" y1="300" x2="620" y2="300"/>
      <line class="grid" x1="0" y1="250" x2="620" y2="250"/>
      <line class="grid" x1="0" y1="200" x2="620" y2="200"/>
      <line class="grid" x1="0" y1="150" x2="620" y2="150"/>
      <line class="grid" x1="0" y1="100" x2="620" y2="100"/>
      <line class="grid" x1="0" y1="50" x2="620" y2="50"/>
    </g>

    <line class="axis" x1="0" y1="0" x2="0" y2="350"/>
    <line class="axis" x1="0" y1="350" x2="620" y2="350"/>

    <g>
      <text class="tick" x="-20" y="355" text-anchor="end">0</text>
      <text class="tick" x="-20" y="305" text-anchor="end">5</text>
      <text class="tick" x="-20" y="255" text-anchor="end">10</text>
      <text class="tick" x="-20" y="205" text-anchor="end">15</text>
      <text class="tick" x="-20" y="155" text-anchor="end">20</text>
      <text class="tick" x="-20" y="105" text-anchor="end">25</text>
      <text class="tick" x="-20" y="55" text-anchor="end">30</text>
      <text class="tick" x="-20" y="5" text-anchor="end">35</text>
      <text class="tick" x="-20" y="-10" text-anchor="end">40</text>
    </g>

    <g>
      <text class="tick" x="20" y="385" text-anchor="middle">1</text>
      <text class="tick" x="82" y="385" text-anchor="middle">2</text>
      <text class="tick" x="144" y="385" text-anchor="middle">3</text>
      <text class="tick" x="206" y="385" text-anchor="middle">4</text>
      <text class="tick" x="268" y="385" text-anchor="middle">5</text>
      <text class="tick" x="330" y="385" text-anchor="middle">6</text>
      <text class="tick" x="392" y="385" text-anchor="middle">7</text>
      <text class="tick" x="454" y="385" text-anchor="middle">8</text>
      <text class="tick" x="516" y="385" text-anchor="middle">9</text>
      <text class="tick" x="578" y="385" text-anchor="middle">10</text>
    </g>

    <path class="ideal" d="M 20 50 L 82 90 L 144 130 L 206 170 L 268 210 L 330 250 L 392 290 L 454 330 L 516 340 L 578 350"/>

    <path class="actual" d="M 20 50 L 82 90 L 144 150 L 206 190 L 268 220 L 330 280 L 392 310 L 454 330 L 516 350 L 578 350"/>

    <g fill="#6ea56b">
      <circle class="point" cx="20" cy="50" r="5"/>
      <circle class="point" cx="82" cy="90" r="5"/>
      <circle class="point" cx="144" cy="150" r="5"/>
      <circle class="point" cx="206" cy="190" r="5"/>
      <circle class="point" cx="268" cy="220" r="5"/>
      <circle class="point" cx="330" cy="280" r="5"/>
      <circle class="point" cx="392" cy="310" r="5"/>
      <circle class="point" cx="454" cy="330" r="5"/>
      <circle class="point" cx="516" cy="350" r="5"/>
      <circle class="point" cx="578" cy="350" r="5"/>
    </g>

    <g>
      <text class="label" x="620" y="350" text-anchor="start">Day</text>
      <text class="label" x="-60" y="-20" text-anchor="middle" transform="rotate(-90 -60 -20)">Remaining work</text>
    </g>
  </g>

  <g transform="translate(440,24)">
    <rect x="0" y="0" width="220" height="52" rx="8" fill="#ffffff" stroke="#d6dde8"/>
    <line class="ideal" x1="18" y1="18" x2="54" y2="18"/>
    <text class="legend" x="66" y="24">Ideal line</text>
    <line class="actual" x1="18" y1="36" x2="54" y2="36"/>
    <text class="legend" x="66" y="42">Actual work</text>
  </g>
</svg>
