<line x1="228" y1="272" x2="286" y2="272" stroke="#B8A9C9" stroke-width="10" marker-end="url(#al)"/>
<text x="392" y="162" text-anchor="middle" font-size="17" font-weight="700" fill="#B8A9C9">Sprint</text>
