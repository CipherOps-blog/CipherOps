<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" role="img" aria-labelledby="t d">
<title id="t">The Scrum cycle</title>
<desc id="d">Items move from the product backlog into a sprint backlog, are built over a two to four week sprint containing a daily twenty-four hour cycle, and emerge as a potentially shippable increment.</desc>
<defs>
 <marker id="as" markerUnits="userSpaceOnUse" markerWidth="30" markerHeight="30" refX="27" refY="15" orient="auto"><path d="M0,1 L30,15 L0,29 Z" fill="#87A878"/></marker>
