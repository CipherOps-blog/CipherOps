<svg xmlns="http://www.w3.org/2000/svg" width="830" height="440" viewBox="0 0 830 440" role="img" aria-labelledby="t d">
<title id="t">Extreme Programming core practices</title>
<desc id="d">The five core Extreme Programming practices shown as cards above the short feedback loop they run inside.</desc>
<defs>
 <marker id="as" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#87A878"/></marker>
</defs>
<style>
 text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
 .pt{font-size:15px;font-weight:600}
 .ct{font-size:13px;font-weight:600}
 .cd{font-size:11px;fill-opacity:.9}
 .sn{font-size:12px;font-weight:600}
 .cp{font-size:12px;fill-opacity:.9}
 .sg{fill:#87A878}.lv{fill:#B8A9C9}
</style>

<text class="pt sg" x="20" y="34">Extreme Programming specifies technical practices, not only process roles</text>

<g stroke-width="2">
  <rect x="20"  y="52" width="150" height="200" rx="11" fill="#87A878" fill-opacity=".11" stroke="#87A878"/>
  <rect x="184" y="52" width="150" height="200" rx="11" fill="#B8A9C9" fill-opacity=".11" stroke="#B8A9C9"/>
  <rect x="348" y="52" width="150" height="200" rx="11" fill="#87A878" fill-opacity=".11" stroke="#87A878"/>
  <rect x="512" y="52" width="150" height="200" rx="11" fill="#B8A9C9" fill-opacity=".11" stroke="#B8A9C9"/>
  <rect x="676" y="52" width="150" height="200" rx="11" fill="#87A878" fill-opacity=".11" stroke="#87A878"/>
</g>

<g fill="none" stroke="#87A878" stroke-width="2">
  <rect x="74" y="86" width="42" height="30" rx="4"/>
  <circle cx="81" cy="132" r="7"/><circle cx="109" cy="132" r="7"/>
  <line x1="81" y1="139" x2="81" y2="150"/><line x1="109" y1="139" x2="109" y2="150"/>
</g>
<text class="ct sg" x="95" y="184" text-anchor="middle">Pair programming</text>
<text class="cd sg" x="95" y="208" text-anchor="middle">Two developers work</text>
<text class="cd sg" x="95" y="224" text-anchor="middle">at one workstation.</text>

<g fill="none" stroke="#B8A9C9" stroke-width="2" stroke-linecap="round">
  <path d="M234 132 a25 25 0 1 1 12 21" />
  <path d="M240 100 l-8 -8 l10 -6" />
  <path d="M251 122 l6 7 l12 -15"/>
</g>
<text class="ct lv" x="259" y="184" text-anchor="middle">Test-driven</text>
<text class="ct lv" x="259" y="200" text-anchor="middle">development</text>
<text class="cd lv" x="259" y="222" text-anchor="middle">Tests are written</text>
<text class="cd lv" x="259" y="238" text-anchor="middle">before the code.</text>

<g fill="none" stroke="#87A878" stroke-width="2" stroke-linecap="round">
  <path d="M392 92 L423 122"/><path d="M454 92 L423 122"/><path d="M423 122 L423 152"/>
  <circle cx="392" cy="92" r="6"/><circle cx="454" cy="92" r="6"/><circle cx="423" cy="152" r="6"/>
</g>
<text class="ct sg" x="423" y="184" text-anchor="middle">Continuous</text>
<text class="ct sg" x="423" y="200" text-anchor="middle">integration</text>
<text class="cd sg" x="423" y="222" text-anchor="middle">Changes are merged</text>
<text class="cd sg" x="423" y="238" text-anchor="middle">and tested often.</text>

<g fill="none" stroke="#B8A9C9" stroke-width="2">
  <rect x="551" y="112" width="24" height="24" rx="4"/>
  <rect x="587" y="112" width="24" height="24" rx="4"/>
  <rect x="623" y="112" width="24" height="24" rx="4"/>
  <line x1="575" y1="124" x2="585" y2="124" marker-end="url(#as)" stroke="#B8A9C9"/>
  <line x1="611" y1="124" x2="621" y2="124" marker-end="url(#as)" stroke="#B8A9C9"/>
</g>
<text class="ct lv" x="587" y="184" text-anchor="middle">Small, frequent</text>
<text class="ct lv" x="587" y="200" text-anchor="middle">releases</text>
<text class="cd lv" x="587" y="222" text-anchor="middle">Feedback cycles with</text>
<text class="cd lv" x="587" y="238" text-anchor="middle">users stay short.</text>

<g fill="none" stroke="#87A878" stroke-width="2">
  <rect x="726" y="106" width="50" height="36" rx="5"/>
  <path d="M712 92 L724 104" marker-end="url(#as)"/>
  <path d="M790 92 L778 104" marker-end="url(#as)"/>
  <path d="M751 160 L751 146" marker-end="url(#as)"/>
</g>
<text class="ct sg" x="751" y="184" text-anchor="middle">Collective code</text>
<text class="ct sg" x="751" y="200" text-anchor="middle">ownership</text>
<text class="cd sg" x="751" y="222" text-anchor="middle">Anyone may change</text>
<text class="cd sg" x="751" y="238" text-anchor="middle">any part of the code.</text>

<text class="pt lv" x="20" y="300">All of it runs inside a short iteration</text>
<g stroke-width="2" fill="none">
  <rect x="20"  y="316" width="140" height="46" rx="9" fill="#B8A9C9" fill-opacity=".14" stroke="#B8A9C9"/>
  <rect x="196" y="316" width="140" height="46" rx="9" fill="#B8A9C9" fill-opacity=".14" stroke="#B8A9C9"/>
  <rect x="372" y="316" width="140" height="46" rx="9" fill="#B8A9C9" fill-opacity=".14" stroke="#B8A9C9"/>
  <rect x="548" y="316" width="140" height="46" rx="9" fill="#B8A9C9" fill-opacity=".14" stroke="#B8A9C9"/>
</g>
<g class="sn lv" text-anchor="middle">
  <text x="90" y="344">Plan</text><text x="266" y="344">Write test, code</text><text x="442" y="344">Integrate</text><text x="618" y="344">Release</text>
</g>
<g stroke="#87A878" stroke-width="2" marker-end="url(#as)">
  <line x1="162" y1="339" x2="190" y2="339"/>
  <line x1="338" y1="339" x2="366" y2="339"/>
  <line x1="514" y1="339" x2="542" y2="339"/>
</g>
<path d="M690 339 L740 339 L740 388 L90 388 L90 366" fill="none" stroke="#87A878" stroke-width="2" marker-end="url(#as)"/>
<text class="cp sg" x="415" y="382" text-anchor="middle">user feedback returns to the next iteration</text>

<text class="cp sg" x="415" y="424" text-anchor="middle">Extreme Programming shares Scrum's short iterations but weights engineering discipline over process roles and ceremonies.</text>
</svg>
